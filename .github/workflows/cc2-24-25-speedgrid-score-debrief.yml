name: CC2-24/25 SpeedGrid Sound and Circuit Debrief Qualification

on:
  push:
    branches: [feature/cc2-24-25-speedgrid-score-run-debrief]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Keep the owner-approved Slate / Focus game mathematically unchanged
        shell: bash
        run: |
          set -euo pipefail
          parent=66a3ab972be05cdc52cff88d712abc151c8a5e40
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          while IFS= read -r file; do
            case "$file" in
              src/games/circuit-climb-2/music/SpeedGridMusicReference24.ts|\
              src/games/circuit-climb-2/music/SpeedGridReferenceBridge24.ts|\
              src/games/circuit-climb-2/music/SpeedGridReference24.test.ts|\
              src/games/circuit-climb-2/devtools/cc2-13-15.ts|\
              src/games/circuit-climb-2/devtools/cc2-16a.html|\
              src/games/circuit-climb-2/devtools/cc2-25-run-debrief.js|\
              src/games/circuit-climb-2/devtools/cc2-25-run-debrief.css|\
              src/games/circuit-climb-2/devtools/buildPortable16A.mjs|\
              src/games/circuit-climb-2/devtools/cc2-24-25-browser-smoke.mjs|\
              docs/circuit-climb-2/CC2-24-25-SPEEDGRID-SCORE-DEBRIEF-ROADMAP.md|\
              .github/workflows/cc2-24-25-speedgrid-score-debrief.yml)
                echo "ISOLATED_AUDIO_OR_DEBRIEF_CHANGE: $file";;
              *) echo "PROTECTED_GAME_SOURCE_MODIFIED: $file" >&2;exit 1;;
            esac
          done < <(git diff --name-only "$parent" HEAD)
          git diff --exit-code "$parent" HEAD -- \
            src/games/circuit-climb-2/core/ \
            src/games/circuit-climb-2/math/ \
            src/games/circuit-climb-2/pursuer/ \
            src/games/circuit-climb-2/enemies/ \
            src/games/circuit-climb-2/config/ \
            src/games/circuit-climb-2/world/ \
            src/games/circuit-climb-2/features/ \
            src/games/circuit-climb-2/progression/ \
            src/games/circuit-climb-2/learning/ \
            src/games/circuit-climb-2/devtools/cc2-19-red-shell.js \
            src/games/circuit-climb-2/devtools/cc2-20-living-pursuer.js \
            src/games/circuit-climb-2/devtools/cc2-23-secondary-enemies.js \
            src/games/circuit-climb-2/devtools/cc2-ui-slate-focus-43.css
          mkdir -p cc2-24-25-evidence
          {
            echo "protected_slate_parent=$parent"
            echo "candidate=$(git rev-parse HEAD)"
            echo "math_pursuer_capture_specials=UNCHANGED"
          } | tee cc2-24-25-evidence/CUSTODY.txt
      - name: Freeze dependency graph, static type check and JavaScript validation
        run: |
          npm ci
          npm run lint
          node --check src/games/circuit-climb-2/devtools/cc2-25-run-debrief.js
          node --check src/games/circuit-climb-2/devtools/cc2-24-25-browser-smoke.mjs
      - name: Full historical mathematical correctness and new sound reference tests
        run: npx vitest run src/games/circuit-climb-2/
      - name: Real browser score and debrief, summary accuracy, restart, five screens
        run: node src/games/circuit-climb-2/devtools/cc2-24-25-browser-smoke.mjs
      - name: Retain previous accepted capture and input behavior
        run: |
          node src/games/circuit-climb-2/devtools/cc2-21-cohesion-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-16b-input-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-slate-focus-43-smoke.mjs
      - name: Portable single-file gameplay including both phases
        run: |
          node src/games/circuit-climb-2/devtools/buildPortable16A.mjs
          node src/games/circuit-climb-2/devtools/cc2-16a-portable-smoke.mjs
          cp cc2-standalone/CC2-16A-Pursuer-Integrity-Playable.html \
             cc2-standalone/CC2-24-25-SpeedGrid-Debrief-Playable.html
          sha256sum cc2-standalone/CC2-24-25-SpeedGrid-Debrief-Playable.html \
            | tee cc2-24-25-evidence/PORTABLE-SHA256.txt
      - name: Production build
        run: npm run build
      - name: Preserve owner screenshots and offline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CC2-24-25-SpeedGrid-Debrief-Owner-Review
          path: |
            cc2-24-25-evidence/
            cc2-slate-focus-43-evidence/
            cc2-21-evidence/
            cc2-standalone/CC2-24-25-SpeedGrid-Debrief-Playable.html
          if-no-files-found: warn
          retention-days: 90
