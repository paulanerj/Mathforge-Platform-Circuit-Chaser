name: CC2-04 portable offline gameplay bundle
on:
  push:
    branches: [feature/cc2-04-results-sdk]
    paths:
      - 'src/games/circuit-climb-2/devtools/cc2-04.html'
      - 'src/games/circuit-climb-2/devtools/cc2-02a.ts'
      - 'src/games/circuit-climb-2/devtools/buildPortable.mjs'
      - 'src/games/circuit-climb-2/devtools/cc2-04-portable-smoke.mjs'
      - '.github/workflows/cc2-04-portable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle game to one self-contained HTML
        run: node src/games/circuit-climb-2/devtools/buildPortable.mjs
      - name: Prove file-protocol play without network
        run: node src/games/circuit-climb-2/devtools/cc2-04-portable-smoke.mjs
      - name: Upload playable one-file artifact
        uses: actions/upload-artifact@v4
        with:
          name: CC2-04-Portable-Verified-HTML
          path: cc2-standalone/CC2-04-Playable.html
          retention-days: 30
