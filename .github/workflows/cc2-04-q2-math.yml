name: CC2-04-Q2 mathematical curriculum and browser qualification
on:
  push:
    branches: [feature/cc2-04-q2-curriculum-integrity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run lint
      - name: CC2-04-Q2 independently tested curricula and continuity
        run: npx vitest run src/games/circuit-climb-2/tests
      - name: Entire inherited and successor test suite
        run: npm test
      - name: Production project build
        run: npm run build
      - name: CC2-04 verified original playable regressions
        run: node src/games/circuit-climb-2/devtools/cc2-04-browser-smoke.mjs
      - name: Q2 first-row target and skip-count actual browser proof
        run: node src/games/circuit-climb-2/devtools/cc2-04-q2-browser-smoke.mjs
      - name: Protected original Circuit Climb browser smoke
        run: npm run test:circuit-climb:browser
