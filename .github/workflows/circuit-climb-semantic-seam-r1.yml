name: Circuit Climb semantic seam R1
on:
  push:
    branches:
      - integration/circuit-climb-semantic-seam-r1
permissions:
  contents: read

jobs:
  semantic-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assert bounded successor diff
        shell: bash
        run: |
          set -euo pipefail
          base=0a6f138f229119bc6b6c15ee1f658046c7075f50
          git merge-base --is-ancestor "$base" HEAD
          allowed='^(.github/workflows/circuit-climb-semantic-seam-r1.yml|CIRCUIT_CLIMB_SEMANTIC_ATTEMPT_SEAM_R1.md|src/games/circuit-climb/runtime/(useCircuitClimbPrototypeRuntime.ts|circuitClimbSemanticEvents.ts)|src/games/circuit-climb/tests/circuitClimbSemanticEvents.test.ts)$'
          bad="$(git diff --name-only "$base"...HEAD | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected files changed from SOT-02 successor base:"
            echo "$bad"
            exit 1
          fi

      - name: Verify protected SOT-02 gameplay identities
        shell: bash
        run: |
          set -euo pipefail
          authority=c8838c30947c2a561bfc8322a6159e4f28fef61a
          for path in             src/games/circuit-climb/CircuitClimbSurface.tsx             src/games/circuit-climb/geometry/circuitClimbGeometry.ts             src/games/circuit-climb/runtime/circuitClimbLearnerRouting.ts             src/games/circuit-climb/services/CircuitClimbMathAdapter.ts             src/games/circuit-climb/pursuer/circuitClimbPursuer.ts             src/games/circuit-climb/styles/circuit-climb.css
          do
            test "$(git rev-parse "$authority:$path")" = "$(git rev-parse "HEAD:$path")"
          done

      - name: Verify semantic publication boundary
        shell: bash
        run: |
          set -euo pipefail
          runtime=src/games/circuit-climb/runtime/useCircuitClimbPrototypeRuntime.ts
          test "$(grep -c 'publishCircuitClimbAttemptEvaluatedEvent(' "$runtime")" -eq 1
          grep -q 'travel = selection.travel' "$runtime"
          grep -q 'CIRCUIT_CLIMB_LEARNER_ROUTE_FAILED' "$runtime"
          grep -q 'attemptOrdinal: ++attemptOrdinalRef.current' "$runtime"
          ! grep -q 'attemptOrdinalRef.current = 0' "$runtime"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:circuit-climb:browser

      - name: Verify semantic exclusions
        shell: bash
        run: |
          set -euo pipefail
          event=src/games/circuit-climb/runtime/circuitClimbSemanticEvents.ts
          ! grep -E 'mastery|assignmentComplete|hostCompletion|bestRow|captured|pursuer' "$event"
