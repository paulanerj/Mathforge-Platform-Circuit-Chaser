name: CC2-27 Distinct Secondary Enemies and Legacy Replay Qualification
on:
  push:
    branches: [feature/cc2-27-role-distinct-enemy-ecology]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce separate CC2-27 policy and protect CC2-26
        shell: bash
        run: |
          set -euo pipefail
          parent=def14c7493220f4418dcc7fe235d6a113e12a6d8
          git merge-base --is-ancestor "$parent" HEAD
          while IFS= read -r file; do
            case "$file" in
              src/games/circuit-climb-2/enemies/secondaryEnemies.ts|\
              src/games/circuit-climb-2/enemies/secondaryRoles27.test.ts|\
              src/games/circuit-climb-2/devtools/cc2-02a.ts|\
              src/games/circuit-climb-2/devtools/cc2-16a.html|\
              src/games/circuit-climb-2/devtools/buildPortable16A.mjs|\
              src/games/circuit-climb-2/devtools/cc2-27-*|\
              docs/circuit-climb-2/CC2-26-27-GAMEPLAY-AUDIT-PM-DISPOSITION.md|\
              .github/workflows/cc2-27-role-distinct.yml)
                echo "CC227_EXPLICIT_TEST_BRANCH_CHANGE: $file";;
              *) echo "CC227_PROTECTED_SOURCE_DRIFT: $file" >&2;exit 1;;
            esac
          done < <(git diff --name-only "$parent" HEAD)
          git diff --exit-code "$parent" HEAD -- \
            src/games/circuit-climb-2/core \
            src/games/circuit-climb-2/math \
            src/games/circuit-climb-2/features \
            src/games/circuit-climb-2/progression \
            src/games/circuit-climb-2/pursuer \
            src/games/circuit-climb-2/devtools/cc2-19-red-shell.js \
            src/games/circuit-climb-2/devtools/cc2-20-living-pursuer.js \
            src/games/circuit-climb-2/music
      - name: Install, lint and JS syntax
        run: |
          npm ci
          npm run lint
          node --check src/games/circuit-climb-2/devtools/cc2-27-role-readability.js
          node --check src/games/circuit-climb-2/devtools/cc2-27-owner-smoke.mjs
      - name: Full historical math, catch, replay and distinct-role unit tests
        run: npx vitest run src/games/circuit-climb-2/
      - name: Real browser encounter and owner regression suites
        run: |
          node src/games/circuit-climb-2/devtools/cc2-27-owner-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-23-browser-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-26-owner-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-21-cohesion-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-24-25-browser-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-16b-input-smoke.mjs
      - name: Offline game including both independent phases and production compile
        run: |
          node src/games/circuit-climb-2/devtools/buildPortable16A.mjs
          node src/games/circuit-climb-2/devtools/cc2-16a-portable-smoke.mjs
          cp cc2-standalone/CC2-16A-Pursuer-Integrity-Playable.html \
             cc2-standalone/CC2-26-27-Living-Pursuer-Enemy-Ecology-Playable.html
          sha256sum cc2-standalone/CC2-26-27-Living-Pursuer-Enemy-Ecology-Playable.html
          npm run build
      - name: Preserve replay, source and owner visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CC2-26-27-Owner-Review-and-Offline-Playable
          path: |
            cc2-26-evidence/
            cc2-27-evidence/
            cc2-21-evidence/
            cc2-23-evidence/
            cc2-24-25-evidence/
            cc2-standalone/CC2-26-27-Living-Pursuer-Enemy-Ecology-Playable.html
          if-no-files-found: warn
          retention-days: 90
