name: CC2 UI Slate Focus 43 Owner Integration Candidate

on:
  push:
    branches: [feature/cc2-ui-slate-focus-43-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slate-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prove accepted gameplay and capture source completely unchanged
        shell: bash
        run: |
          set -euo pipefail
          parent=876907daed183ff3c52b35b626f4d3afa08fe80b
          git cat-file -e "$parent^{commit}"
          git merge-base --is-ancestor "$parent" HEAD
          while IFS= read -r path; do
            case "$path" in
              src/games/circuit-climb-2/devtools/presets/cc2-ui-slate-focus-43.json|\
              src/games/circuit-climb-2/devtools/cc2-ui-slate-focus-43.css|\
              src/games/circuit-climb-2/devtools/cc2-16a.html|\
              src/games/circuit-climb-2/devtools/buildPortable16A.mjs|\
              src/games/circuit-climb-2/devtools/cc2-slate-focus-43-smoke.mjs|\
              docs/circuit-climb-2/CC2-SLATE-FOCUS-43-OWNER-HANDOFF.md|\
              .github/workflows/cc2-ui-slate-focus-43.yml)
                echo "APPROVED_SKIN_ONLY: $path" ;;
              *)
                echo "PROTECTED_GAMEPLAY_SOURCE_CHANGED: $path" >&2;exit 1 ;;
            esac
          done < <(git diff --name-only "$parent" HEAD)
          git diff --exit-code "$parent" HEAD -- \
            src/games/circuit-climb-2/core/ \
            src/games/circuit-climb-2/pursuer/ \
            src/games/circuit-climb-2/enemies/ \
            src/games/circuit-climb-2/math/ \
            src/games/circuit-climb-2/world/ \
            src/games/circuit-climb-2/config/ \
            src/games/circuit-climb-2/features/ \
            src/games/circuit-climb-2/progression/ \
            src/games/circuit-climb-2/music/ \
            src/games/circuit-climb-2/devtools/cc2-19-red-shell.js \
            src/games/circuit-climb-2/devtools/cc2-20-living-pursuer.js
          mkdir -p cc2-slate-focus-43-evidence
          {
            echo "owner_preset=Slate / Focus"
            echo "concept_id=43"
            echo "accepted_game_parent=$parent"
            echo "candidate_sha=$(git rev-parse HEAD)"
            echo "all_protected_gameplay_unchanged=TRUE"
            git diff --name-only "$parent" HEAD
          } | tee cc2-slate-focus-43-evidence/source-custody.txt
      - name: Install and TypeScript check
        run: |
          npm ci
          npm run lint
          node --check src/games/circuit-climb-2/devtools/cc2-slate-focus-43-smoke.mjs
      - name: Historical mathematics and Pursuer/source tests
        run: npx vitest run src/games/circuit-climb-2/
      - name: Real Slate / Focus on/off gameplay and viewport regression
        run: node src/games/circuit-climb-2/devtools/cc2-slate-focus-43-smoke.mjs
      - name: Capture animation source integrity and real input
        run: |
          node src/games/circuit-climb-2/devtools/cc2-21-cohesion-smoke.mjs
          node src/games/circuit-climb-2/devtools/cc2-16b-input-smoke.mjs
      - name: Portable game includes opt-in Slate skin
        run: |
          node src/games/circuit-climb-2/devtools/buildPortable16A.mjs
          node src/games/circuit-climb-2/devtools/cc2-16a-portable-smoke.mjs
          cp cc2-standalone/CC2-16A-Pursuer-Integrity-Playable.html \
            cc2-standalone/CC2-Slate-Focus-43-Owner-Playable.html
          sha256sum cc2-standalone/CC2-Slate-Focus-43-Owner-Playable.html | tee cc2-slate-focus-43-evidence/portable-sha256.txt
      - name: Build deployable game
        run: npm run build
      - name: Upload owner evidence and portable copy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CC2-Slate-Focus-43-Owner-Review
          path: |
            cc2-slate-focus-43-evidence/
            cc2-standalone/CC2-Slate-Focus-43-Owner-Playable.html
          retention-days: 90
          if-no-files-found: warn
