name: CC2-34 Creature Ecology and Relay Domain
on:
  push:
    branches:
      - feature/cc2-33-34-relay-ecology-foundation-20261117
  pull_request:
    paths:
      - 'src/games/circuit-climb-2/features/creatureEcologyRelay34.ts'
      - 'src/games/circuit-climb-2/tests/creatureEcologyRelay34.test.ts'
      - '.github/workflows/cc2-34-relay-domain.yml'
permissions:
  contents: read
jobs:
  domain-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Build packaged Circuit Climb game
        run: npm run build
      - name: Verify opt-in visual JS source syntax
        run: node --check src/games/circuit-climb-2/devtools/cc2-34-relay-preview.js
      - name: Verify embedded standalone visual script syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const s=fs.readFileSync('dist/cc2-30.html','utf8');
          const m=s.match(/<script id="cc234-relay-preview-controller">([\\s\\S]*?)<\\/script>/);
          if(!m)throw Error('CC234_CONTROLLER_MISSING');
          new vm.Script(m[1],{filename:'cc234-embedded.js'});
          console.log('PASS: packaged Relay preview script parses');
          NODE
      - name: Relay in real Chromium game at phone/tablet widths
        run: node src/games/circuit-climb-2/devtools/cc2-34-relay-browser-smoke.mjs
      - name: Relay, Creature SDK, and core mathematical regression
        run: npx vitest run src/games/circuit-climb-2/tests/creatureEcologyRelay34.test.ts src/games/circuit-climb-2/tests/creatureMaterials39A.test.ts src/games/circuit-climb-2/tests/creatureRosterIntegrity32.test.ts src/games/circuit-climb-2/features/creatureAbilitySDK30B.test.ts src/games/circuit-climb-2/tests/coreTransactions.test.ts
