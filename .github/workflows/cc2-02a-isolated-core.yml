name: CC2-02A isolated math world learner core
on:
  push:
    branches:
      - feature/cc2-02a-core-world-math
    paths:
      - 'src/games/circuit-climb-2/**'
      - '.github/workflows/cc2-02a-isolated-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Protect inherited SOT-02 game files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fe3f88c629548ce0f21540ef3fc5a748b16000c8 HEAD
          frozen=0a6f138f229119bc6b6c15ee1f658046c7075f50
          while IFS= read -r file; do
            actual="$(git rev-parse "HEAD:$file")"
            expected="$(git rev-parse "$frozen:$file")"
            if [ "$actual" != "$expected" ]; then
              echo "Protected SOT-02 file changed: $file"
              exit 1
            fi
          done < <(git ls-tree -r --name-only "$frozen" src/games/circuit-climb/)
          product=c8838c30947c2a561bfc8322a6159e4f28fef61a
          for file in \
            src/games/circuit-climb/CircuitClimbSurface.tsx \
            src/games/circuit-climb/geometry/circuitClimbGeometry.ts \
            src/games/circuit-climb/runtime/circuitClimbLearnerRouting.ts \
            src/games/circuit-climb/runtime/useCircuitClimbPrototypeRuntime.ts \
            src/games/circuit-climb/services/CircuitClimbMathAdapter.ts \
            src/games/circuit-climb/pursuer/circuitClimbPursuer.ts \
            src/games/circuit-climb/styles/circuit-climb.css
          do
            test "$(git rev-parse "HEAD:$file")" = "$(git rev-parse "$product:$file")"
          done
          echo "Protected Circuit Climb source and transfer: unchanged."
      - run: npm ci
      - name: TypeScript project validation
        run: npm run lint
      - name: Source-backed new CC2-02A core tests
        run: npx vitest run src/games/circuit-climb-2/tests
      - name: Export 20-row deterministic gameplay replay
        run: npx tsx src/games/circuit-climb-2/devtools/exportGolden.mts > cc2-02a-golden-run.json
      - name: Retain golden evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc2-02a-20-row-golden-replay
          path: cc2-02a-golden-run.json
          retention-days: 30
      - name: Retained original unit suite
        run: npm test
      - name: Production build remains intact
        run: npm run build
      - name: New CC2-02A standalone browser smoke
        run: node src/games/circuit-climb-2/devtools/cc2-02a-browser-smoke.mjs
      - name: Retained original playable browser smoke
        run: npm run test:circuit-climb:browser
